# Geliştirme ortamı için MSSQL veritabanı.
# Çalıştırmak için proje klasöründe:   docker compose up -d
# Durdurmak için:                       docker compose down
# (Veriler "mssql-veri" alanında saklanır, durdurup açınca kaybolmaz.)
#
# NOT: Buradaki şifre sadece geliştirme içindir.
# appsettings.Development.json içindeki şifreyle aynı olmalı.

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: etikkurul-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EtikKurul_Gelistirme2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-veri:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mssql-veri:
